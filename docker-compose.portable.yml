name: "${OPENCLAUDE_COMPOSE_PROJECT_NAME:-openclaude}"

services:
  openclaude-agent:
    depends_on:
      openclaude-ollama-bootstrap:
        condition: service_completed_successfully
    volumes: !override
      - type: bind
        source: "${OPENCLAUDE_HOST_CONFIG_DIR:-./.openclaude-data/config}"
        target: /home/node/.openclaude
      - type: bind
        source: "${OPENCLAUDE_HOST_CODEX_DIR:-./.openclaude-data/codex}"
        target: /run/codex
      - type: bind
        source: .
        target: /workspace
    environment:
      OPENCLAUDE_TELEGRAM_CRON_TIMEZONE: "${OPENCLAUDE_TELEGRAM_CRON_TIMEZONE:-UTC}"

  openclaude-worker-1:
    depends_on:
      openclaude-ollama-bootstrap:
        condition: service_completed_successfully
    environment:
      OPENCLAUDE_TELEGRAM_CRON_TIMEZONE: "${OPENCLAUDE_TELEGRAM_CRON_TIMEZONE:-UTC}"
      OPENCLAUDE_PROVIDER: "${OPENCLAUDE_DOCKER_PROVIDER:-ollama}"
      OPENCLAUDE_BASE_URL: "${OPENCLAUDE_DOCKER_BASE_URL:-http://openclaude-ollama:11434/v1}"
      OPENCLAUDE_MODEL: "${OPENCLAUDE_DOCKER_MODEL:-qwen3:1.7b}"
      OPENCLAUDE_API_KEY: "${OPENCLAUDE_DOCKER_API_KEY:-ollama-local}"
      CODEX_HOME: "/run/codex"
      CODEX_AUTH_JSON_PATH: "/run/codex/auth.json"
      CODEX_MODELS_CACHE_PATH: "/run/codex/models_cache.json"
    volumes: !override
      - openclaude-worker-1-config:/home/node/.openclaude
      - type: bind
        source: "${OPENCLAUDE_HOST_CODEX_DIR:-./.openclaude-data/codex}"
        target: /run/codex
      - type: bind
        source: .
        target: /workspace

  openclaude-worker-2:
    depends_on:
      openclaude-ollama-bootstrap:
        condition: service_completed_successfully
    environment:
      OPENCLAUDE_TELEGRAM_CRON_TIMEZONE: "${OPENCLAUDE_TELEGRAM_CRON_TIMEZONE:-UTC}"
      OPENCLAUDE_PROVIDER: "${OPENCLAUDE_DOCKER_PROVIDER:-ollama}"
      OPENCLAUDE_BASE_URL: "${OPENCLAUDE_DOCKER_BASE_URL:-http://openclaude-ollama:11434/v1}"
      OPENCLAUDE_MODEL: "${OPENCLAUDE_DOCKER_MODEL:-qwen3:1.7b}"
      OPENCLAUDE_API_KEY: "${OPENCLAUDE_DOCKER_API_KEY:-ollama-local}"
      CODEX_HOME: "/run/codex"
      CODEX_AUTH_JSON_PATH: "/run/codex/auth.json"
      CODEX_MODELS_CACHE_PATH: "/run/codex/models_cache.json"
    volumes: !override
      - openclaude-worker-2-config:/home/node/.openclaude
      - type: bind
        source: "${OPENCLAUDE_HOST_CODEX_DIR:-./.openclaude-data/codex}"
        target: /run/codex
      - type: bind
        source: .
        target: /workspace

  telegram-mcp:
    env_file: !override
      - path: "${OPENCLAUDE_HOST_TELEGRAM_MCP_DIR:-./.openclaude-data/telegram-mcp}/.env"
        required: false
    volumes: !override
      - type: bind
        source: "${OPENCLAUDE_HOST_TELEGRAM_MCP_DIR:-./.openclaude-data/telegram-mcp}"
        target: /data

  telegram-mcp-web:
    env_file: !override
      - path: "${OPENCLAUDE_HOST_TELEGRAM_MCP_DIR:-./.openclaude-data/telegram-mcp}/.env"
        required: false
    volumes: !override
      - type: bind
        source: "${OPENCLAUDE_HOST_TELEGRAM_MCP_DIR:-./.openclaude-data/telegram-mcp}"
        target: /data

  omniroute:
    environment:
      REQUIRE_API_KEY: "${OMNIROUTE_REQUIRE_API_KEY:-false}"

  openclaude-ollama-bootstrap:
    image: ollama/ollama:latest@sha256:bfc9c6d53cc6989aa5131a6fde6b162b2802d4d337657f3253b5f69579bddeee
    restart: "no"
    depends_on:
      openclaude-ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://openclaude-ollama:11434"
      OPENCLAUDE_BOOTSTRAP_OLLAMA_MODEL: "${OPENCLAUDE_BOOTSTRAP_OLLAMA_MODEL:-qwen3:1.7b}"
      OPENCLAUDE_BOOTSTRAP_EMBEDDING_MODEL: "${OPENCLAUDE_BOOTSTRAP_EMBEDDING_MODEL:-nomic-embed-text:latest}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama pull "$${OPENCLAUDE_BOOTSTRAP_OLLAMA_MODEL}" &&
        ollama pull "$${OPENCLAUDE_BOOTSTRAP_EMBEDDING_MODEL}"
