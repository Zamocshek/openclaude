services:
  app:
    build: .
    container_name: 3dsecure-kit
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - BOT_TOKEN=${BOT_TOKEN:-}
      - ADMIN_IDS=${ADMIN_IDS:-}
      - FLASK_SECRET=${FLASK_SECRET:-}
      - PORT=${PORT:-5000}
      - HOST=0.0.0.0
    volumes:
      - 3dsecure_data:/app/data
      - 3dsecure_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Optional: auto-updater via watchtower
  watchtower:
    image: containrrr/watchtower
    container_name: 3dsecure-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 86400 --cleanup 3dsecure-kit
    profiles:
      - auto-update

volumes:
  3dsecure_data:
  3dsecure_logs:
