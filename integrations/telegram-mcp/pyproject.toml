[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-mcp"
version = "2.0.1"
description = "Telegram integration for Claude via the Model Context Protocol"
readme = "README.md"
authors = [
    {name = "Zamocshek"},
    {name = "chigwell"},
    {name = "l1v0n1"}
]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.8.0",
    "nest-asyncio>=1.6.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.1.0",
    "python-json-logger>=3.3.0",
    "python-multipart>=0.0.9",
    "python-socks[asyncio]>=2.4.0",
    "telethon>=1.39.0",
    "uvicorn[standard]>=0.34.0"
]

[project.urls]
"Homepage" = "https://github.com/Zamocshek/telegram-mcp"
"Bug Tracker" = "https://github.com/Zamocshek/telegram-mcp/issues"
"Upstream" = "https://github.com/chigwell/telegram-mcp"

[tool.setuptools]
py-modules = ["main", "account_admin", "assistant_memory", "content_workflow", "maton_client", "operator_config", "post_formatting", "runtime_config", "session_string_generator", "stat_report_renderer", "vpromotions_client", "web_app"]

[project.scripts]
telegram-mcp = "main:main"
telegram-mcp-generate-session = "session_string_generator:main"
telegram-mcp-render-stat = "stat_report_renderer:main"
telegram-mcp-vpromotions = "vpromotions_client:main"
telegram-mcp-maton = "maton_client:main"
telegram-mcp-web = "web_app:main"

[tool.black]
line-length = 99
target-version = ['py311']

[tool.flake8]
ignore = ["E203", "E501", "W503"]
max-line-length = 99
max-complexity = 10
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    "docs/source/conf.py",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "flake8>=7.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
