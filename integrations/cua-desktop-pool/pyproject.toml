[project]
name = "cua-desktop-pool"
version = "0.1.0"
description = "Local multi-desktop automation pool powered by Cua Sandbox"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cua-sandbox==0.3.4",
    "httpx>=0.27.0",
    "mcp[cli]==2.0.0",
]

[project.scripts]
cua-desktop-pool = "cua_desktop_pool.cli:main"
cua-desktop-pool-mcp = "cua_desktop_pool.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cua_desktop_pool"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
