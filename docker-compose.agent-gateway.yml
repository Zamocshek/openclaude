      OPENCLAUDE_TELEGRAM_TRANSCRIBE_AUDIO: "${OPENCLAUDE_WORKER_1_TELEGRAM_TRANSCRIBE_AUDIO:-${OPENCLAUDE_WORKER_TELEGRAM_TRANSCRIBE_AUDIO:-1}}"
      OPENCLAUDE_TELEGRAM_TRANSCRIPTION_PROVIDER: "${OPENCLAUDE_WORKER_1_TELEGRAM_TRANSCRIPTION_PROVIDER:-${OPENCLAUDE_WORKER_TELEGRAM_TRANSCRIPTION_PROVIDER:-auto}}"
      OPENCLAUDE_TELEGRAM_TRANSCRIPTION_WHISPER_MODEL: "${OPENCLAUDE_WORKER_1_TELEGRAM_TRANSCRIPTION_WHISPER_MODEL:-${OPENCLAUDE_WORKER_TELEGRAM_TRANSCRIPTION_WHISPER_MODEL:-base}}"
      OPENCLAUDE_TELEGRAM_TRANSCRIPTION_OPENAI_MODEL: "${OPENCLAUDE_WORKER_1_TELEGRAM_TRANSCRIPTION_OPENAI_MODEL:-${OPENCLAUDE_WORKER_TELEGRAM_TRANSCRIPTION_OPENAI_MODEL:-whisper-1}}"
      OPENCLAUDE_TELEGRAM_AGENT_RECOVERY_ATTEMPTS: "${OPENCLAUDE_WORKER_1_TELEGRAM_AGENT_RECOVERY_ATTEMPTS:-${OPENCLAUDE_WORKER_TELEGRAM_AGENT_RECOVERY_ATTEMPTS:-${OPENCLAUDE_TELEGRAM_AGENT_RECOVERY_ATTEMPTS:-2}}}"
      OPENCLAUDE_TELEGRAM_AGENT_FAILURE_KIND_LIMIT: "${OPENCLAUDE_TELEGRAM_AGENT_FAILURE_KIND_LIMIT:-2}"
      OPENCLAUDE_OUROBOROS_ENABLED: "${OPENCLAUDE_WORKER_1_OUROBOROS_ENABLED:-${OPENCLAUDE_WORKER_OUROBOROS_ENABLED:-0}}"
