    image: docker.io/searxng/searxng:latest@sha256:268fdb05efbb7b4fdc5957a20c42389bfb1b1b27b5eddeb98f75ec80c45b960f
    restart: unless-stopped
    environment:
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_PORT: "8080"
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
      SEARXNG_SECRET: "${SEARXNG_SECRET:-openclaude-local-only-change-before-public-exposure}"
    ports:
      - "127.0.0.1:${OPENCLAUDE_SEARXNG_HOST_PORT:-18088}:8080"
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --proxy=off http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    depends_on:
      - openclaude-agent
    environment:
      OPENAI_API_BASE_URLS: "http://openclaude-agent:8642/v1"
