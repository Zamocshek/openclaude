      OPENCLAUDE_EVOLUTION_INTERVAL_SECONDS: "${OPENCLAUDE_WORKER_1_EVOLUTION_INTERVAL_SECONDS:-${OPENCLAUDE_WORKER_EVOLUTION_INTERVAL_SECONDS:-21600}}"
      OPENCLAUDE_AGENT_RUNNER_CWD: "${OPENCLAUDE_WORKER_RUNNER_CWD:-${OPENCLAUDE_DOCKER_RUNNER_CWD:-/workspace}}"
      OPENCLAUDE_AGENT_RUNNER_MAX_TURNS: "${OPENCLAUDE_AGENT_WORKER_MAX_TURNS:-240}"
