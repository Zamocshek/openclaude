services:
  openclaude-agent:
    build:
      context: .
    image: openclaude-agent:local
    restart: unless-stopped
    command: ["--agent-gateway-server"]
    stdin_open: true
    tty: true
    user: "0:0"
    privileged: true
    depends_on:
      searxng:
        condition: service_healthy
    environment:
      OPENCLAUDE_DOCKER_RUN_AS_ROOT: "${OPENCLAUDE_DOCKER_RUN_AS_ROOT:-1}"
      OPENCLAUDE_ALLOW_ROOT_BYPASS_PERMISSIONS: "${OPENCLAUDE_ALLOW_ROOT_BYPASS_PERMISSIONS:-1}"
      OPENCLAUDE_AGENT_API_ENABLED: "1"
      OPENCLAUDE_AGENT_API_HOST: "0.0.0.0"
      OPENCLAUDE_AGENT_API_PORT: "8642"
      OPENCLAUDE_AGENT_API_KEY: "${OPENCLAUDE_AGENT_API_KEY:-change-me}"
      OPENCLAUDE_AGENT_WEB_BIND_HOST: "0.0.0.0"
      OPENCLAUDE_AGENT_WEB_PORTS: "3000-3010,5173,8000,8080"
      OPENCLAUDE_AGENT_WEB_HOST_URLS: "3000=http://localhost:13000,3001=http://localhost:13001,3002=http://localhost:13002,3003=http://localhost:13003,3004=http://localhost:13004,3005=http://localhost:13005,3006=http://localhost:13006,3007=http://localhost:13007,3008=http://localhost:13008,3009=http://localhost:13009,3010=http://localhost:13010,5173=http://localhost:15173,8000=http://localhost:18000,8080=http://localhost:18080"
      OPENCLAUDE_AGENT_CRON_ENABLED: "${OPENCLAUDE_AGENT_CRON_ENABLED:-1}"
      OPENCLAUDE_AGENT_CRON_TICK_SECONDS: "${OPENCLAUDE_AGENT_CRON_TICK_SECONDS:-60}"
      OPENCLAUDE_TELEGRAM_CRON_TIMEZONE: "${OPENCLAUDE_TELEGRAM_CRON_TIMEZONE:-Europe/Simferopol}"
      OPENCLAUDE_TELEGRAM_ENABLED: "${OPENCLAUDE_DOCKER_TELEGRAM_ENABLED:-0}"
      TELEGRAM_BOT_TOKEN: "${OPENCLAUDE_DOCKER_TELEGRAM_BOT_TOKEN:-}"
      OPENCLAUDE_TELEGRAM_HOME_CHAT_ID: "${OPENCLAUDE_DOCKER_TELEGRAM_HOME_CHAT_ID:-}"
      OPENCLAUDE_TELEGRAM_ALLOWED_CHAT_IDS: "${OPENCLAUDE_DOCKER_TELEGRAM_ALLOWED_CHAT_IDS:-}"
      OPENCLAUDE_TELEGRAM_ALLOWED_USER_IDS: "${OPENCLAUDE_DOCKER_TELEGRAM_ALLOWED_USER_IDS:-}"
      OPENCLAUDE_TELEGRAM_DOWNLOAD_FILES: "${OPENCLAUDE_TELEGRAM_DOWNLOAD_FILES:-1}"
      OPENCLAUDE_TELEGRAM_MAX_DOWNLOAD_BYTES: "${OPENCLAUDE_TELEGRAM_MAX_DOWNLOAD_BYTES:-20971520}"
      OPENCLAUDE_TELEGRAM_MAX_UPLOAD_BYTES: "${OPENCLAUDE_TELEGRAM_MAX_UPLOAD_BYTES:-52428800}"
      OPENCLAUDE_TELEGRAM_TRANSCRIBE_AUDIO: "${OPENCLAUDE_TELEGRAM_TRANSCRIBE_AUDIO:-1}"
      OPENCLAUDE_TELEGRAM_TRANSCRIPTION_PROVIDER: "${OPENCLAUDE_TELEGRAM_TRANSCRIPTION_PROVIDER:-auto}"
      OPENCLAUDE_TELEGRAM_TRANSCRIPTION_WHISPER_MODEL: "${OPENCLAUDE_TELEGRAM_TRANSCRIPTION_WHISPER_MODEL:-base}"
      OPENCLAUDE_TELEGRAM_TRANSCRIPTION_OPENAI_MODEL: "${OPENCLAUDE_TELEGRAM_TRANSCRIPTION_OPENAI_MODEL:-whisper-1}"
      OPENCLAUDE_TELEGRAM_AGENT_RECOVERY_ATTEMPTS: "${OPENCLAUDE_TELEGRAM_AGENT_RECOVERY_ATTEMPTS:-2}"
      OPENCLAUDE_TELEGRAM_AGENT_FAILURE_KIND_LIMIT: "${OPENCLAUDE_TELEGRAM_AGENT_FAILURE_KIND_LIMIT:-2}"
      OPENCLAUDE_OUROBOROS_ENABLED: "${OPENCLAUDE_OUROBOROS_ENABLED:-0}"
      OPENCLAUDE_CONSCIOUSNESS_ENABLED: "${OPENCLAUDE_CONSCIOUSNESS_ENABLED:-0}"
      OPENCLAUDE_INFINITE_TASKS_ENABLED: "${OPENCLAUDE_INFINITE_TASKS_ENABLED:-0}"
      OPENCLAUDE_OUROBOROS_WAKEUP_MIN_SECONDS: "${OPENCLAUDE_OUROBOROS_WAKEUP_MIN_SECONDS:-300}"
      OPENCLAUDE_OUROBOROS_WAKEUP_MAX_SECONDS: "${OPENCLAUDE_OUROBOROS_WAKEUP_MAX_SECONDS:-7200}"
      OPENCLAUDE_OUROBOROS_MAX_ROUNDS: "${OPENCLAUDE_OUROBOROS_MAX_ROUNDS:-3}"
      OPENCLAUDE_OUROBOROS_BUDGET_FRACTION: "${OPENCLAUDE_OUROBOROS_BUDGET_FRACTION:-0.1}"
      OPENCLAUDE_EVOLUTION_INTERVAL_SECONDS: "${OPENCLAUDE_EVOLUTION_INTERVAL_SECONDS:-21600}"
      OPENCLAUDE_AGENT_RUNNER_CWD: "${OPENCLAUDE_DOCKER_RUNNER_CWD:-/workspace}"
      OPENCLAUDE_AGENT_RUNNER_MAX_TURNS: "${OPENCLAUDE_AGENT_RUNNER_MAX_TURNS:-720}"
      OPENCLAUDE_AGENT_RUNNER_TIMEOUT_MS: "${OPENCLAUDE_AGENT_RUNNER_TIMEOUT_MS:-1800000}"
      OPENCLAUDE_AGENT_RUNNER_PERMISSION_MODE: "${OPENCLAUDE_AGENT_RUNNER_PERMISSION_MODE:-bypassPermissions}"
      OPENCLAUDE_AGENT_RUNNER_DISABLE_TOOLS: "${OPENCLAUDE_AGENT_RUNNER_DISABLE_TOOLS:-0}"
      OPENCLAUDE_AGENT_RUNNER_TOOLS: "${OPENCLAUDE_AGENT_RUNNER_TOOLS:-}"
      OPENCLAUDE_AGENT_RUNNER_DISALLOWED_TOOLS: "${OPENCLAUDE_AGENT_RUNNER_DISALLOWED_TOOLS:-}"
      CLAUDE_CODE_MAX_RETRIES: "${CLAUDE_CODE_MAX_RETRIES:-3}"
      API_TIMEOUT_MS: "${API_TIMEOUT_MS:-60000}"
      OPENCLAUDE_CODEGRAPH_AUTO_INIT: "${OPENCLAUDE_CODEGRAPH_AUTO_INIT:-1}"
      OPENCLAUDE_CODEGRAPH_PROJECT_PATH: "${OPENCLAUDE_CODEGRAPH_PROJECT_PATH:-/workspace}"
      OPENCLAUDE_MCP_PREFLIGHT: "${OPENCLAUDE_MCP_PREFLIGHT:-1}"
      OPENCLAUDE_MCP_PREFLIGHT_STRICT: "${OPENCLAUDE_MCP_PREFLIGHT_STRICT:-1}"
      CODEGRAPH_TELEMETRY: "${CODEGRAPH_TELEMETRY:-0}"
      CODEGRAPH_NO_DOWNLOAD: "${CODEGRAPH_NO_DOWNLOAD:-1}"
      SEARXNG_URL: "${SEARXNG_URL:-http://searxng:8080}"
      SEARXNG_MAX_RESULTS: "${SEARXNG_MAX_RESULTS:-10}"
      SEARXNG_TIMEOUT_MS: "${SEARXNG_TIMEOUT_MS:-20000}"
      CONTEXT7_API_KEY: "${CONTEXT7_API_KEY:-}"
      OPENCLAUDE_CONTEXT_WINDOW_TOKENS: "${OPENCLAUDE_CONTEXT_WINDOW_TOKENS:-${OPENCLAUDE_MAX_CONTEXT_TOKENS:-}}"
      OPENCLAUDE_MAX_CONTEXT_TOKENS: "${OPENCLAUDE_MAX_CONTEXT_TOKENS:-${OPENCLAUDE_CONTEXT_WINDOW_TOKENS:-}}"
      CLAUDE_CODE_MAX_CONTEXT_TOKENS: "${CLAUDE_CODE_MAX_CONTEXT_TOKENS:-${OPENCLAUDE_CONTEXT_WINDOW_TOKENS:-${OPENCLAUDE_MAX_CONTEXT_TOKENS:-}}}"
      OPENCLAUDE_API_MAX_BODY_BYTES: "${OPENCLAUDE_API_MAX_BODY_BYTES:-268435456}"
      OPENCLAUDE_MEMORY_MAX_CHARS: "${OPENCLAUDE_MEMORY_MAX_CHARS:-0}"
      OPENCLAUDE_USER_MEMORY_MAX_CHARS: "${OPENCLAUDE_USER_MEMORY_MAX_CHARS:-0}"
      OPENCLAUDE_SCRATCHPAD_MAX_BLOCKS: "${OPENCLAUDE_SCRATCHPAD_MAX_BLOCKS:-0}"
      OPENCLAUDE_DIALOGUE_CONTEXT_BLOCKS: "${OPENCLAUDE_DIALOGUE_CONTEXT_BLOCKS:-0}"
      OPENCLAUDE_DIALOGUE_BLOCK_MAX_CHARS: "${OPENCLAUDE_DIALOGUE_BLOCK_MAX_CHARS:-0}"
      OPENCLAUDE_MEMORY_BIBLE_MAX_CHARS: "${OPENCLAUDE_MEMORY_BIBLE_MAX_CHARS:-0}"
      OPENCLAUDE_MEMORY_ARCHITECTURE_MAX_CHARS: "${OPENCLAUDE_MEMORY_ARCHITECTURE_MAX_CHARS:-0}"
      OPENCLAUDE_MEMORY_REPO_GUIDE_MAX_CHARS: "${OPENCLAUDE_MEMORY_REPO_GUIDE_MAX_CHARS:-0}"
      CLAUDE_CODE_USE_OPENAI: "${CLAUDE_CODE_USE_OPENAI:-}"
      CLAUDE_CODE_USE_GEMINI: "${CLAUDE_CODE_USE_GEMINI:-}"
      CLAUDE_CODE_USE_MISTRAL: "${CLAUDE_CODE_USE_MISTRAL:-}"
      CLAUDE_CODE_USE_GITHUB: "${CLAUDE_CODE_USE_GITHUB:-}"
      CLAUDE_CODE_USE_BEDROCK: "${CLAUDE_CODE_USE_BEDROCK:-}"
      CLAUDE_CODE_USE_VERTEX: "${CLAUDE_CODE_USE_VERTEX:-}"
      CLAUDE_CODE_USE_FOUNDRY: "${CLAUDE_CODE_USE_FOUNDRY:-}"
      OPENCLAUDE_PROVIDER: "${OPENCLAUDE_DOCKER_PROVIDER:-${OPENCLAUDE_PROVIDER:-}}"
      OPENCLAUDE_BASE_URL: "${OPENCLAUDE_DOCKER_BASE_URL:-${OPENCLAUDE_BASE_URL:-}}"
      OPENCLAUDE_MODEL: "${OPENCLAUDE_DOCKER_MODEL:-${OPENCLAUDE_MODEL:-}}"
      OPENCLAUDE_API_KEY: "${OPENCLAUDE_DOCKER_API_KEY:-${OPENCLAUDE_API_KEY:-}}"
      OPENCLAUDE_DEEPSEEK_API_KEY: "${OPENCLAUDE_DEEPSEEK_API_KEY:-${DEEPSEEK_API_KEY:-}}"
      OPENAI_BASE_URL: "${OPENCLAUDE_DOCKER_BASE_URL:-${OPENAI_BASE_URL:-}}"
      OPENAI_MODEL: "${OPENCLAUDE_DOCKER_MODEL:-${OPENAI_MODEL:-}}"
      OPENAI_API_KEY: "${OPENCLAUDE_DOCKER_API_KEY:-${OPENAI_API_KEY:-}}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-${OPENCLAUDE_DEEPSEEK_API_KEY:-}}"
      # Subscription auth comes from the shared Codex auth.json below. Do not
      # let a copied short-lived access token override its refreshable token set.
      CODEX_API_KEY: ""
      CODEX_CREDENTIAL_SOURCE: "${CODEX_CREDENTIAL_SOURCE:-}"
      CHATGPT_ACCOUNT_ID: "${CHATGPT_ACCOUNT_ID:-}"
      CODEX_ACCOUNT_ID: "${CODEX_ACCOUNT_ID:-}"
      CODEX_HOME: "/run/codex"
      CODEX_AUTH_JSON_PATH: "/run/codex/auth.json"
      CODEX_MODELS_CACHE_PATH: "/run/codex/models_cache.json"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-}"
      GEMINI_BASE_URL: "${GEMINI_BASE_URL:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      MISTRAL_MODEL: "${MISTRAL_MODEL:-}"
      MISTRAL_BASE_URL: "${MISTRAL_BASE_URL:-}"
      WEB_SEARCH_PROVIDER: "${WEB_SEARCH_PROVIDER:-custom}"
      WEB_PROVIDER: "${WEB_PROVIDER:-searxng}"
      WEB_KEY: "${WEB_KEY:-}"
      WEB_SEARCH_API: "${WEB_SEARCH_API:-http://searxng:8080/search}"
      WEB_QUERY_PARAM: "${WEB_QUERY_PARAM:-}"
      WEB_METHOD: "${WEB_METHOD:-}"
      WEB_PARAMS: "${WEB_PARAMS:-}"
      WEB_URL_TEMPLATE: "${WEB_URL_TEMPLATE:-}"
      WEB_BODY_TEMPLATE: "${WEB_BODY_TEMPLATE:-}"
      WEB_AUTH_HEADER: "${WEB_AUTH_HEADER:-}"
      WEB_AUTH_SCHEME: "${WEB_AUTH_SCHEME:-}"
      WEB_HEADERS: "${WEB_HEADERS:-}"
      WEB_JSON_PATH: "${WEB_JSON_PATH:-}"
      WEB_CUSTOM_TIMEOUT_SEC: "${WEB_CUSTOM_TIMEOUT_SEC:-}"
      WEB_CUSTOM_MAX_BODY_KB: "${WEB_CUSTOM_MAX_BODY_KB:-}"
      WEB_CUSTOM_ALLOW_ARBITRARY_HEADERS: "${WEB_CUSTOM_ALLOW_ARBITRARY_HEADERS:-}"
      WEB_CUSTOM_ALLOW_HTTP: "${WEB_CUSTOM_ALLOW_HTTP:-true}"
      WEB_CUSTOM_ALLOW_PRIVATE: "${WEB_CUSTOM_ALLOW_PRIVATE:-true}"
      FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY:-}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      EXA_API_KEY: "${EXA_API_KEY:-}"
      YOU_API_KEY: "${YOU_API_KEY:-}"
      JINA_API_KEY: "${JINA_API_KEY:-}"
      BING_API_KEY: "${BING_API_KEY:-}"
      MOJEEK_API_KEY: "${MOJEEK_API_KEY:-}"
      LINKUP_API_KEY: "${LINKUP_API_KEY:-}"
      MCPR_TOKEN: "${MCPR_TOKEN:-}"
      MCPR_HOST: "${OPENCLAUDE_DOCKER_MCPR_HOST:-host.docker.internal}"
      MCPR_PORT: "${MCPR_PORT:-3282}"
      MCP_TIMEOUT: "${MCP_TIMEOUT:-5000}"
      OPENRAG_URL: "${OPENCLAUDE_DOCKER_OPENRAG_URL:-${OPENRAG_URL:-http://host.docker.internal:3000}}"
      OPENRAG_API_KEY: "${OPENRAG_API_KEY:-}"
      OPENRAG_MCP_TIMEOUT: "${OPENRAG_MCP_TIMEOUT:-60}"
      CAMOFOX_URL: "${OPENCLAUDE_DOCKER_CAMOFOX_URL:-${CAMOFOX_URL:-http://host.docker.internal:9377}}"
      CAMOFOX_ACCESS_KEY: "${CAMOFOX_ACCESS_KEY:-}"
      CAMOFOX_API_KEY: "${CAMOFOX_API_KEY:-}"
      CAMOFOX_MCP_TIMEOUT: "${CAMOFOX_MCP_TIMEOUT:-60}"
      HINDSIGHT_URL: "${OPENCLAUDE_DOCKER_HINDSIGHT_URL:-${HINDSIGHT_URL:-http://host.docker.internal:8888}}"
      HINDSIGHT_API_KEY: "${HINDSIGHT_API_KEY:-}"
      HINDSIGHT_BANK_ID: "${HINDSIGHT_BANK_ID:-openclaude-agent}"
      HINDSIGHT_MCP_TIMEOUT: "${HINDSIGHT_MCP_TIMEOUT:-60}"
    ports:
      - "${OPENCLAUDE_AGENT_API_HOST_PORT:-8642}:8642"
      - "${OPENCLAUDE_AGENT_WEB_3000_PORT:-13000}:3000"
      - "${OPENCLAUDE_AGENT_WEB_3001_PORT:-13001}:3001"
      - "${OPENCLAUDE_AGENT_WEB_3002_PORT:-13002}:3002"
      - "${OPENCLAUDE_AGENT_WEB_3003_PORT:-13003}:3003"
      - "${OPENCLAUDE_AGENT_WEB_3004_PORT:-13004}:3004"
      - "${OPENCLAUDE_AGENT_WEB_3005_PORT:-13005}:3005"
      - "${OPENCLAUDE_AGENT_WEB_3006_PORT:-13006}:3006"
      - "${OPENCLAUDE_AGENT_WEB_3007_PORT:-13007}:3007"
      - "${OPENCLAUDE_AGENT_WEB_3008_PORT:-13008}:3008"
      - "${OPENCLAUDE_AGENT_WEB_3009_PORT:-13009}:3009"
      - "${OPENCLAUDE_AGENT_WEB_3010_PORT:-13010}:3010"
      - "${OPENCLAUDE_AGENT_WEB_5173_PORT:-15173}:5173"
      - "${OPENCLAUDE_AGENT_WEB_8000_PORT:-18000}:8000"
      - "${OPENCLAUDE_AGENT_WEB_8080_PORT:-18080}:8080"
    volumes:
      - type: bind
        source: "${OPENCLAUDE_HOST_CONFIG_DIR:-${USERPROFILE}/.openclaude}"
        target: /home/node/.openclaude
      - type: bind
        source: "${OPENCLAUDE_HOST_CODEX_DIR:-${USERPROFILE}/.codex}"
        target: /run/codex
      - ./:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /workspace
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8642/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

