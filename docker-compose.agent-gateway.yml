      OPENCLAUDE_TELEGRAM_DOWNLOAD_FILES: "${OPENCLAUDE_WORKER_1_TELEGRAM_DOWNLOAD_FILES:-${OPENCLAUDE_WORKER_TELEGRAM_DOWNLOAD_FILES:-1}}"
